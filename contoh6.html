<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Formulir - HTML & CSS Dasar</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --accent:#4f46e5;
      --muted:#6b7280;
      --radius:12px;
      --maxw:520px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,var(--bg),#eef2f7);
      padding:32px;
      color:#111827;
    }

    .card{
      width:100%;
      max-width:var(--maxw);
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:0 6px 24px rgba(16,24,40,0.08);
      padding:28px;
    }

    h1{font-size:20px;margin:0 0 6px}
    p.lead{margin:0 0 20px;color:var(--muted);font-size:14px}

    form{
      display:grid;
      gap:14px;
    }

    .row{display:flex;gap:12px}
    .col{flex:1}

    label{display:block;font-size:13px;margin-bottom:6px;color:#111827}
    input[type="text"], input[type="email"], input[type="password"], select, textarea{
      width:100%;
      padding:10px 12px;
      border:1px solid #e6e9ef;
      border-radius:8px;
      font-size:14px;
      outline:none;
      transition:box-shadow .15s, border-color .12s;
      background:transparent;
    }

    input:focus, select:focus, textarea:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(79,70,229,0.08);
    }

    .small{font-size:12px;color:var(--muted)}

    .controls{display:flex;gap:10px;align-items:center}
    .radio-group, .checkbox-group{display:flex;gap:12px;align-items:center}

    .btn{
      display:inline-block;
      padding:10px 14px;
      border-radius:10px;
      border:0;
      background:var(--accent);
      color:white;
      font-weight:600;
      cursor:pointer;
    }

    .btn.secondary{background:#eef2ff;color:var(--accent);border:1px solid rgba(79,70,229,0.08)}

    .note{font-size:13px;color:var(--muted)}

    .success{
      padding:10px 12px;border-radius:10px;background:#ecfdf5;color:#065f46;border:1px solid #bbf7d0;margin-top:8px;
    }

    @media (max-width:520px){
      .row{flex-direction:column}
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Formulir Pendaftaran</h1>
    <p class="lead">Contoh form sederhana menggunakan HTML + CSS. Coba isi lalu klik kirim.</p>

    <form id="demoForm" novalidate>
      <div class="row">
        <div class="col">
          <label for="firstName">Nama Depan</label>
          <input id="firstName" name="firstName" type="text" placeholder="Budi" required />
        </div>
        <div class="col">
          <label for="lastName">Nama Belakang</label>
          <input id="lastName" name="lastName" type="text" placeholder="Santoso" />
        </div>
      </div>

      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="name@example.com" required />
        <p class="small">Kami akan mengirimkan konfirmasi ke alamat di atas.</p>
      </div>

      <div class="row">
        <div class="col">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="6" placeholder="Minimal 6 karakter" required />
        </div>
        <div class="col">
          <label for="role">Peran</label>
          <select id="role" name="role">
            <option value="user">Pengguna</option>
            <option value="admin">Admin</option>
            <option value="editor">Editor</option>
          </select>
        </div>
      </div>

      <div>
        <label>Jenis Kelamin</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="male" checked> Laki-laki</label>
          <label><input type="radio" name="gender" value="female"> Perempuan</label>
          <label><input type="radio" name="gender" value="other"> Lainnya</label>
        </div>
      </div>

      <div>
        <label for="bio">Tentang Anda</label>
        <textarea id="bio" name="bio" rows="4" placeholder="Tuliskan sedikit tentang diri anda..."></textarea>
      </div>

      <div class="controls">
        <label class="checkbox-group"><input type="checkbox" id="agree" required> Saya menyetujui syarat dan ketentuan</label>
      </div>

      <div style="display:flex;gap:10px;align-items:center;margin-top:6px">
        <button class="btn" type="submit">Kirim</button>
        <button class="btn secondary" type="reset">Reset</button>
        <div id="result" aria-live="polite"></div>
      </div>

      <p class="note">* Contoh ini hanya untuk demonstrasi. Tambahkan server-side validation saat digunakan di produksi.</p>
    </form>
  </main>

  <script>
    // Simple client-side handling: prevent real submit and show a message
    const form = document.getElementById('demoForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      // simple HTML5 validation check
      if (!form.checkValidity()){
        form.reportValidity();
        return;
      }

      const data = new FormData(form);
      const obj = {};
      data.forEach((v,k) => {
        if (obj[k]){
          // handle multiple values (e.g. checkboxes)
          obj[k] = [].concat(obj[k], v);
        } else obj[k] = v;
      });

      // show success box
      result.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'success';
      box.textContent = `Terima kasih, ${obj.firstName || 'Pengguna'} — form berhasil dikirim (contoh).`;
      result.appendChild(box);

      // in a real app you'd send `obj` to the server via fetch()
      console.log('FORM DATA:', obj);
    });
  </script>
</body>
</html>
